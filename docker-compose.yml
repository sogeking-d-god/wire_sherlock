version: '3.8'

services:
  db:
    image: postgres:15
    container_name: wiresherlock_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wiresherlock
    # Persist database data even if container is deleted
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d wiresherlock"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: wiresherlock_ollama
    # `unless-stopped` brings the daemon back if the entrypoint ever exits
    # (e.g. ollama serve crashes, or the manifest-verify DNS flake on Windows
    # leaks past the entrypoint's retry loop). Stopped manually = stays stopped.
    restart: unless-stopped
    # Bypass Docker Desktop's embedded resolver (127.0.0.11), which intermittently
    # returns "server misbehaving" on Windows for the registry.ollama.ai and
    # cloudflarestorage.com lookups that `ollama pull` makes in parallel. With
    # explicit upstream DNS, the 14 concurrent blob-part downloads stop racing
    # the broken resolver and the pull completes in one shot.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "11434:11434"
    volumes:
      # Named volume so pulled models survive container restarts
      - ollama_models:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    environment:
      # llama3.2:1b is ~1.3 GB (vs 2 GB for 3b). With Docker Desktop's default
      # ~4 GB memory budget split across all containers, the 3b variant couldn't
      # load before the client timeout; the 1b model fits comfortably and still
      # handles the agent's tool-calling JSON contract for our narrow set of
      # tools (find_http_attacks, find_anomalies, cluster_anomalies, list_metrics).
      OLLAMA_MODEL: llama3.2:1b
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      # `ollama list` exits 0 once the daemon's API is up. We deliberately do
      # NOT gate on the model being pulled — warmup_model's retry loop in the
      # backend handles that, so the backend can start (and serve auth) while
      # the model is still downloading.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # Uncomment the block below to expose the host NVIDIA GPU to Ollama.
    # Requires the nvidia-container-toolkit installed on the Docker host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      # Use the root directory as context so it can see requirements.txt and api folder
      context: .
      dockerfile: backend/Dockerfile
    container_name: wiresherlock_backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Internal Docker DNS allows using 'db' as the hostname
      DATABASE_URL: postgresql://user:password@db:5432/wiresherlock
      # Local LLM agent — Ollama runs in the sibling service.
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./pcap_files:/app/pcap_files

  frontend:
    build:
      # Frontend context is its own directory
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wiresherlock_frontend
    ports:
      - "5173:5173"
    volumes:
      # Sync source code for live development
      - ./frontend:/app
      # Keep node_modules inside the container to avoid conflicts with host
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_models:
